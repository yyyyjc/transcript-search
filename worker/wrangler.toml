# Cloudflare Worker 部署設定
# 文件：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "transcript-search"
main = "worker.js"
compatibility_date = "2025-10-01"

# 明示啟用 workers.dev 子網域與 preview URL（消除 deploy warning）
workers_dev = true
preview_urls = true

# === Secrets（在終端機用 wrangler secret put 設定，不寫進此檔）===
# ANTHROPIC_API_KEY  — 必要

# === Vars（公開設定，可寫此檔）===
# 暫無；DRIVE_FOLDER_IDS / MODEL 都寫死在 worker.js 中

# === 觀測 ===
# 若你升級到 Workers Paid plan（$5/月）可開啟以下，獲得完整 logs 留存
# [observability]
# enabled = true
# head_sampling_rate = 1.0
#
# 免費版替代方案：開新終端機跑 `wrangler tail` 即時看 log（不留存）
